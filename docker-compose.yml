version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: darglobal_backend_dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=True
      - PORT=8000
      - HOST=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_LLM_MODEL=meta-llama/llama-3.3-70b-instruct:free
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - darglobal-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: darglobal_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - darglobal-net

networks:
  darglobal-net:
    driver: bridge
